name = "devtrack-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ENVIRONMENT = "production"
AUTH_PROVIDER = "email"
GOOGLE_CLIENT_ID = ""
ALLOWED_ORIGIN = "https://devtrack-api.ratnivaofficial.workers.dev"
APP_URL = "https://devtrack-api.ratnivaofficial.workers.dev/"
LOCAL_AUTH = "false"
LOCAL_EMAIL_PREVIEW = "false"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
OWNER_EMAIL = "vikas@devtrack.invalid"
SINGLE_USER_NAME = "vikas"

[[d1_databases]]
binding = "DB"
database_name = "devtrack"
database_id = "3a17e57a-d5f7-4ab3-a5a9-cca3abbb885c"
migrations_dir = "../../migrations"

[env.test.vars]
AUTH_PROVIDER = "email"
GOOGLE_CLIENT_ID = ""
ENVIRONMENT = "local"
LOCAL_AUTH = "false"
LOCAL_EMAIL_PREVIEW = "true"
APP_URL = "http://127.0.0.1:5174"
ALLOWED_ORIGIN = "http://127.0.0.1:5174"
OWNER_EMAIL = "local@devtrack.test"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[env.test.d1_databases]]
binding = "DB"
database_name = "devtrack-test"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../migrations"

[env.local.vars]
AUTH_PROVIDER = "email"
LOCAL_EMAIL_PREVIEW = "true"
APP_URL = "http://localhost:5173"
GOOGLE_CLIENT_ID = ""
ENVIRONMENT = "local"
LOCAL_AUTH = "false"
ALLOWED_ORIGIN = "http://localhost:5173"
OWNER_EMAIL = "CONFIGURE_OWNER_EMAIL"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[env.local.d1_databases]]
binding = "DB"
database_name = "devtrack"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations"
